<body>

                Change Theme

        </header>
        <div id="main-row">

        </footer>
    </div>
    <script>
        function switchTheme() {
            let themes = ["", "dark"];
            let root = document.querySelector(":root");
            root.className = themes[(themes.indexOf(root.className) + 1) % themes.length];
        }
    </script>
